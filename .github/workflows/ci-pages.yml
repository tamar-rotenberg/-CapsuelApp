name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily refresh of real product data (prices, stock) when a feed is configured.
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      # Private affiliate feed link, saved in Settings → Secrets and variables → Actions.
      SHEIN_FEED_URL: ${{ secrets.SHEIN_FEED_URL }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publishing needs GitHub Pages switched on once (Settings → Pages → Source: GitHub Actions).
      # Until then, skip quietly instead of failing every run.
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off. Turn it on in Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@v5
      - if: steps.pages.outputs.enabled == 'true' && env.SHEIN_FEED_URL != ''
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Import real SHEIN products from the affiliate feed
        if: steps.pages.outputs.enabled == 'true' && env.SHEIN_FEED_URL != ''
        run: node scripts/import-feed.mjs "$SHEIN_FEED_URL" || echo "::warning::Feed import failed, publishing with demo products."
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
